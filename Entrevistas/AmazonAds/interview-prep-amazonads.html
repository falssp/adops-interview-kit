<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amazon Ads — Interview Prep</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg:    #F5F6F8;
  --surf:  #FFFFFF;
  --fg:    #111318;
  --fg2:   #4B5060;
  --fg3:   #8A8F9E;
  --bdr:   #E2E4EA;
  --acc:   #FF9900;
  --acc-bg:#FFF8EE;
  --grn:   #16A34A;
  --grn-bg:#F0FDF4;
  --warn:  #D97706;
  --warn-bg:#FFFBEB;
  --tag-bg:#F1F3F7;
  --todo:  #7C3AED;
  --todo-bg:#EDE9FE;

  --t-empresa:  #1E40AF; --t-empresa-bg:  #DBEAFE;
  --t-prep:     #065F46; --t-prep-bg:     #D1FAE5;
  --t-tech:     #7C3AED; --t-tech-bg:     #EDE9FE;
  --t-sit:      #BE185D; --t-sit-bg:      #FCE7F3;
  --t-com:      #0369A1; --t-com-bg:      #E0F2FE;
  --t-sal:      #9A3412; --t-sal-bg:      #FFEDD5;
  --t-abertas:  #4D7C0F; --t-abertas-bg:  #ECFCCB;
  --t-lp:       #7C2D12; --t-lp-bg:       #FEF3C7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0E1117; --surf:#181C27; --fg:#E8EAF0; --fg2:#9BA3B8; --fg3:#555C74;
    --bdr:#252A3A; --acc:#FFB84D; --acc-bg:#2C1E00; --grn:#22C55E; --grn-bg:#052E16;
    --warn:#FCD34D; --warn-bg:#2C1810; --tag-bg:#1C2133; --todo:#A78BFA; --todo-bg:#2E1065;
    --t-empresa:#60A5FA; --t-empresa-bg:#1E3A8A;
    --t-prep:#34D399; --t-prep-bg:#022C22;
    --t-tech:#A78BFA; --t-tech-bg:#2E1065;
    --t-sit:#F472B6; --t-sit-bg:#500724;
    --t-com:#38BDF8; --t-com-bg:#082F49;
    --t-sal:#FB923C; --t-sal-bg:#431407;
    --t-abertas:#A3E635; --t-abertas-bg:#1A2E05;
    --t-lp:#FCD34D; --t-lp-bg:#451A00;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0E1117; --surf:#181C27; --fg:#E8EAF0; --fg2:#9BA3B8; --fg3:#555C74;
  --bdr:#252A3A; --acc:#FFB84D; --acc-bg:#2C1E00; --grn:#22C55E; --grn-bg:#052E16;
  --warn:#FCD34D; --warn-bg:#2C1810; --tag-bg:#1C2133; --todo:#A78BFA; --todo-bg:#2E1065;
  --t-empresa:#60A5FA; --t-empresa-bg:#1E3A8A;
  --t-prep:#34D399; --t-prep-bg:#022C22;
  --t-tech:#A78BFA; --t-tech-bg:#2E1065;
  --t-sit:#F472B6; --t-sit-bg:#500724;
  --t-com:#38BDF8; --t-com-bg:#082F49;
  --t-sal:#FB923C; --t-sal-bg:#431407;
  --t-abertas:#A3E635; --t-abertas-bg:#1A2E05;
  --t-lp:#FCD34D; --t-lp-bg:#451A00;
  color-scheme: dark;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.6}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--surf);border-bottom:1px solid var(--bdr);padding:10px 24px}
.bar-inner{max-width:1400px;margin-inline:auto;display:flex;align-items:center;gap:12px}
.brand{font-size:15px;font-weight:700;white-space:nowrap;color:var(--fg)}
.pill{display:inline-block;background:var(--acc);color:#fff;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.search-wrap{flex:1;position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:10px;width:16px;height:16px;color:var(--fg3)}
#q{width:100%;padding:7px 32px 7px 32px;border:1.5px solid var(--bdr);border-radius:8px;background:var(--bg);color:var(--fg);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:var(--fg3)}
.clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--fg3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
#count{font-size:12px;color:var(--fg3);white-space:nowrap}

.filters{max-width:1400px;margin-inline:auto;padding:10px 24px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bdr)}
.fb{padding:4px 11px;border-radius:20px;border:1.5px solid var(--bdr);background:transparent;color:var(--fg3);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--acc);color:var(--acc)}
.fb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fb[data-f="empresa"].on{background:var(--t-empresa);border-color:var(--t-empresa)}
.fb[data-f="prep"].on{background:var(--t-prep);border-color:var(--t-prep)}
.fb[data-f="tech"].on{background:var(--t-tech);border-color:var(--t-tech)}
.fb[data-f="situacional"].on{background:var(--t-sit);border-color:var(--t-sit)}
.fb[data-f="comportamental"].on{background:var(--t-com);border-color:var(--t-com)}
.fb[data-f="salario"].on{background:var(--t-sal);border-color:var(--t-sal)}
.fb[data-f="abertas"].on{background:var(--t-abertas);border-color:var(--t-abertas)}
.fb[data-f="lp"].on{background:var(--t-lp);border-color:var(--t-lp)}

.feed{max-width:1400px;margin-inline:auto;padding:16px 24px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px;align-items:start}
.card{background:var(--surf);border:1.5px solid var(--bdr);border-radius:10px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.card.todo-card{border-color:var(--todo);opacity:.75}
.ch{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.ctag{flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;margin-top:2px}
.t-empresa     {background:var(--t-empresa-bg);color:var(--t-empresa)}
.t-prep        {background:var(--t-prep-bg);color:var(--t-prep)}
.t-tech        {background:var(--t-tech-bg);color:var(--t-tech)}
.t-situacional {background:var(--t-sit-bg);color:var(--t-sit)}
.t-comportamental{background:var(--t-com-bg);color:var(--t-com)}
.t-salario     {background:var(--t-sal-bg);color:var(--t-sal)}
.t-abertas     {background:var(--t-abertas-bg);color:var(--t-abertas)}
.t-lp          {background:var(--t-lp-bg);color:var(--t-lp)}
.cq{flex:1;min-width:0;font-size:14px;font-weight:600}
.chev{flex-shrink:0;width:18px;height:18px;color:var(--fg3);transition:transform .2s;margin-top:2px}
.card.open .chev{transform:rotate(180deg)}
.cb{display:none;padding:0 16px 16px;border-top:1px solid var(--bdr);padding-top:14px}
.card.open .cb{display:block}

.cb p{margin-bottom:10px;font-size:14px;max-width:65ch}
.cb p:last-child{margin-bottom:0}
.cb ul,.cb ol{padding-left:20px;margin-bottom:10px}
.cb li{margin-bottom:3px;font-size:13px}
.cb strong{font-weight:600}
.cb code{font-size:.85em;background:var(--tag-bg);padding:1px 5px;border-radius:3px}
.tip{margin-top:10px;padding:8px 12px;background:var(--grn-bg);border-left:3px solid var(--grn);border-radius:0 6px 6px 0;font-size:13px}
.tip strong{color:var(--grn)}
.box{border-radius:8px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.6}
.box-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.box.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.box.info{background:var(--acc-bg);color:var(--acc);border:1px solid var(--acc)}
.box.ok{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn)}
.box.todo{background:var(--todo-bg);color:var(--todo);border:1px solid var(--todo)}
.box.amz{background:var(--t-lp-bg);color:var(--t-lp);border:1px solid var(--t-lp)}
.box strong{color:inherit}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin:10px 0}
.lp-pill{padding:6px 10px;border-radius:6px;background:var(--t-lp-bg);color:var(--t-lp);font-size:12px;font-weight:600;border:1px solid var(--t-lp)}
.lp-pill small{display:block;font-size:10px;font-weight:400;opacity:.75;margin-top:2px}
.steps{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.sn{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.sb{flex:1;min-width:0}
.sb strong{display:block;font-weight:600;margin-bottom:1px}
.tbl-w{overflow-x:auto;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--tag-bg);color:var(--fg2);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr)}
td{padding:8px 10px;border-bottom:1px solid var(--bdr);vertical-align:top}
tr:last-child td{border-bottom:none}
.doc-h{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.doc-h3{font-size:14px;font-weight:600;margin:16px 0 8px}
.empty{text-align:center;color:var(--fg3);padding:48px;font-size:14px}
mark{background:#FEF08A;color:#1A1916;border-radius:2px;padding:0 1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:#7C6800;color:#EDEBE6}}
:root[data-theme="dark"] mark{background:#7C6800;color:#EDEBE6}
@media(max-width:480px){.bar-inner{gap:8px}.brand{font-size:13px}#count{display:none}}
.ht{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 4px;border-top:1px solid var(--bdr);margin-top:10px}
.ht::before{content:'🔍';font-size:11px;color:var(--fg3);margin-right:2px;align-self:center}
.ht span{font-size:10px;background:var(--tag-bg);color:var(--fg3);border-radius:3px;padding:2px 6px;cursor:default}
.status-row{max-width:1400px;margin-inline:auto;padding:8px 24px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bdr);font-size:12px;color:var(--fg3)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.badge.done{background:var(--grn-bg);color:var(--grn);border-color:var(--grn)}
.badge.wait{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.badge.open{background:var(--acc-bg);color:var(--acc);border-color:var(--acc)}
.badge.todo-b{background:var(--todo-bg);color:var(--todo);border-color:var(--todo)}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-inner">
    <div class="brand">Amazon Ads <span class="pill">Prep</span></div>
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/></svg>
      <input id="q" type="search" placeholder="Search question, topic or keyword…" autocomplete="off">
      <button class="clr" id="clr" style="display:none" onclick="clearQ()">✕</button>
    </div>
    <span id="count"></span>
  </div>
</div>

<div class="status-row">
  <strong style="color:var(--fg2)">Processo:</strong>
  <span class="badge done">✓ Contato via LinkedIn — Paulina Valencia</span>
  <span class="badge done">✓ InMail respondido</span>
  <span class="badge done">✓ CV enviado — pauval@amazon.com</span>
  <span class="badge done">✓ Aplicação enviada — Nov 25, 2026</span>
  <span class="badge todo-b">◦ Recruiter screen</span>
  <span class="badge todo-b">◦ Loop de entrevistas</span>
</div>

<div class="filters" id="filters">
  <button class="fb on" data-f="all">All</button>
  <button class="fb" data-f="empresa">Company</button>
  <button class="fb" data-f="lp">Amazon LPs ⭐</button>
  <button class="fb" data-f="prep">Prep</button>
  <button class="fb" data-f="tech">Technical</button>
  <button class="fb" data-f="situacional">Situational</button>
  <button class="fb" data-f="comportamental">Behavioral</button>
  <button class="fb" data-f="salario">Salary</button>
  <button class="fb" data-f="abertas">Open Qs</button>
</div>

<div class="feed" id="feed"></div>

<script>
const ITEMS = [

  // ════════════════════════════════════════════
  // EMPRESA
  // ════════════════════════════════════════════

  { tag:'empresa', q:'Amazon Ads — who they are and what this team does',
    body:`<div class="ht"><span>Amazon</span><span>Amazon Ads</span><span>DSP</span><span>first-party</span><span>Prime Video</span><span>Twitch</span><span>overview</span></div>
    <div class="tbl-w"><table><tbody>
      <tr><td style="width:130px;color:var(--fg3);font-size:12px">Parent</td><td>Amazon.com — fundada 1994, Seattle. Maior marketplace do mundo.</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Amazon Ads</td><td>Braço de publicidade da Amazon. +$50B em receita anual. Terceiro maior player de digital ads nos EUA (atrás de Google e Meta).</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Produto core</td><td>Amazon DSP — plataforma programática com acesso exclusivo aos dados first-party da Amazon: intenção de compra, histórico de browsing, Prime Video/Twitch, Alexa.</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Inventário</td><td>Amazon.com.br, IMDb TV, Twitch, Amazon Music, Prime Video + third-party exchanges via programmatic.</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Brasil</td><td>Amazon.com.br ativo, Amazon Prime, Prime Video. Mercado em expansão — equipe de Ads relativamente nova no BR.</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Interview language</td><td>Inglês — contato foi em inglês, role global.</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Work model</td><td>São Paulo, 5 dias presencial. Confirmar localização do escritório.</td></tr>
    </tbody></table></div>
    <div class="box amz"><div class="box-lbl">⭐ Diferencial Amazon Ads vs outros DSPs</div>
    O que torna o Amazon DSP único não é a plataforma — é o dado. Enquanto Google tem intent de busca e Meta tem sinal social, Amazon tem <strong>intenção de compra real</strong>: quem pesquisou, adicionou ao carrinho, comprou. Isso é o argumento central para qualquer cliente.
    </div>` },

  { tag:'empresa', q:'How the contact arrived — Paulina Valencia, LinkedIn',
    body:`<div class="ht"><span>contact</span><span>recruiter</span><span>LinkedIn</span><span>Paulina</span><span>Amazon</span><span>Nov 25</span></div>
    <div class="tbl-w"><table><tbody>
      <tr><td style="width:130px;color:var(--fg3);font-size:12px">Pessoa</td><td>Paulina Valencia — Client Lead LATAM, Amazon Ads</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Canal</td><td>LinkedIn DM</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Data</td><td>25 de novembro de 2025</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Email dela</td><td>pauval@amazon.com</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Mensagem</td><td>Outreach proativo — seu perfil em programmatic chamou atenção. Pediu aplicação com CV em inglês pelo link.</td></tr>
      <tr><td style="color:var(--fg3);font-size:12px">Link da vaga</td><td>amazon.jobs/en/jobs/10538335/programmatic-solutions-consultant-amazon-ads</td></tr>
    </tbody></table>
    <div class="tip"><strong>💡</strong> Paulina é Client Lead LATAM — não é recruiter de RH puro. Ela conhece o produto. Respostas técnicas sobre DSP vão ressoar com ela diretamente.</div></div>` },

  { tag:'empresa', q:'Job description — Programmatic Solutions Consultant',
    body:`<div class="ht"><span>JD</span><span>responsibilities</span><span>role</span><span>PSC</span><span>trading desk</span><span>DSP</span><span>consultant</span></div>
    <div class="doc-h3">O que o papel faz</div>
    <ul>
      <li>Manage end-to-end experience for enterprise agency and advertiser clients using Amazon DSP</li>
      <li>Drive expertise in programmatic — help clients become proficient DSP users</li>
      <li>Deliver training, product deep dives, and support for adopting Amazon technologies</li>
      <li>Act as internal voice of customer → influence product roadmap</li>
      <li>Work with agency and advertiser trading desks + internal stakeholders</li>
      <li>Build solutions / beta programs with Product and Engineering</li>
    </ul>
    <div class="doc-h3">Basic qualifications</div>
    <ul>
      <li>6+ years digital advertising + client-facing roles, foco em data analysis</li>
      <li>Experience with annual brand and media planning</li>
    </ul>
    <div class="doc-h3">Preferred qualifications</div>
    <ul>
      <li>Experience in e-commerce or online advertising</li>
    </ul>
    <div class="box amz"><div class="box-lbl">⭐ Fit analysis</div>
    15 anos AdOps ✓ | Client-facing (EssenceMediacom: Samsung, Airbnb, Mars) ✓ | Amazon DSP certificado ✓ | Media planning (worked from media plan input) ✓ | Programmatic (DV360, Open RTB, PMP) ✓
    </div>` },

  { tag:'empresa', q:'Amazon interview process — what to expect (recruiter screen → loop → bar raiser)',
    body:`<div class="ht"><span>process</span><span>stages</span><span>loop</span><span>bar raiser</span><span>LP</span><span>behavioral</span><span>STAR</span></div>
    <div class="box warn"><div class="box-lbl">🎯 Amazon é diferente — LPs são o coração de tudo</div>
    Na Amazon, praticamente toda pergunta comportamental mapeia a um Leadership Principle. O entrevistador está avaliando LPs específicos — não apenas "como foi isso". Prepare histórias concretas mapeadas a LPs antes de qualquer entrevista.
    </div>
    <div class="steps">
      <div class="step"><div class="sn">1</div><div class="sb"><strong>Recruiter screen (Paulina)</strong> ~30–45 min. Background, motivação, fit cultural básico. Pode já tocar em alguns LPs.</div></div>
      <div class="step"><div class="sn">2</div><div class="sb"><strong>Hiring manager screen</strong> ~45–60 min. Mais técnico e LP-focused. Vai explorar profundidade de experiência em DSP e client-facing.</div></div>
      <div class="step"><div class="sn">3</div><div class="sb"><strong>Loop de entrevistas</strong> 3–5 entrevistadores, cada um com LPs designados. Cada um faz 2–4 perguntas comportamentais profundas. Formato virtual ou presencial.</div></div>
      <div class="step"><div class="sn">4</div><div class="sb"><strong>Bar Raiser</strong> Um dos entrevistadores no loop é o Bar Raiser — alguém de fora do time, treinado para manter o bar de contratação alto. Ele pode ser mais difícil. Foca mais em LPs e fit cultural.</div></div>
      <div class="step"><div class="sn">5</div><div class="sb"><strong>Debrief & oferta</strong> Se aprovado por todos + Bar Raiser.</div></div>
    </div>
    <div class="tip"><strong>💡 Prep key:</strong> Prepare 6–8 histórias concretas (situações reais com métricas) que possam responder múltiplos LPs. Nunca use a mesma história duas vezes no loop.</div>` },

  // ════════════════════════════════════════════
  // AMAZON LEADERSHIP PRINCIPLES — ⭐ CRÍTICO
  // ════════════════════════════════════════════

  { tag:'lp', q:'Amazon Leadership Principles — overview e os mais relevantes para este papel',
    body:`<div class="ht"><span>LP</span><span>leadership principles</span><span>Amazon</span><span>behavioral</span><span>culture</span><span>14 principles</span></div>
    <div class="box amz"><div class="box-lbl">⭐ Por que LPs importam aqui</div>
    Amazon tem 16 LPs e os entrevistadores são treinados para avaliá-los. Para o papel de Programmatic Solutions Consultant, os mais relevantes são os 6 abaixo. Prepare histórias para cada um.
    </div>
    <div class="lp-grid">
      <div class="lp-pill">Customer Obsession<small>Clientes antes de tudo — trading desks, anunciantes</small></div>
      <div class="lp-pill">Earn Trust<small>Confiança com clientes e equipes internas</small></div>
      <div class="lp-pill">Dive Deep<small>Ir fundo nos dados, não aceitar superfície</small></div>
      <div class="lp-pill">Deliver Results<small>Resultados concretos, independente das barreiras</small></div>
      <div class="lp-pill">Bias for Action<small>Agir com velocidade, sem esperar perfeição</small></div>
      <div class="lp-pill">Learn and Be Curious<small>Autodesenvolvimento contínuo</small></div>
      <div class="lp-pill">Have Backbone; Disagree and Commit<small>Defender seu ponto, mas executar quando decidido</small></div>
      <div class="lp-pill">Invent and Simplify<small>Simplificar processos e criar soluções</small></div>
    </div>
    <div class="tip"><strong>Formato das respostas:</strong> Sempre STAR — Situation, Task, Action, Result. Amazon quer números. "Reduzimos o tempo de onboarding em 40%" é melhor que "melhoramos bastante o processo."</div>` },

  { tag:'lp', q:'Customer Obsession — história preparada',
    body:`<div class="ht"><span>Customer Obsession</span><span>LP</span><span>client</span><span>advertiser</span><span>advocate</span><span>needs</span></div>
    <div class="box amz"><div class="box-lbl">LP: Customer Obsession — "Leaders start with the customer and work backwards"</div>
    Perguntas prováveis: "Tell me about a time you went above and beyond for a client." / "Describe a time you advocated for the customer even when it was difficult."
    </div>
    <p style="font-size:13px;line-height:1.7"><strong>Situação:</strong> Na EssenceMediacom, um cliente (Samsung) lançou uma campanha de produto novo com janela de apenas 72h antes de um evento de mídia. Depois do go-live, identifiquei que a tag de conversão estava disparando mas sem passar o valor de transação — a campanha perderia toda a atribuição de receita se não corrigíssemos.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Ação:</strong> Às 19h, escalei diretamente para o time de web do cliente (não só para o planner intermediário). Trabalhei com o desenvolvedor deles para identificar a variável ausente no data layer. Verificamos a correção às 23h.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Resultado:</strong> Campanha manteve atribuição completa. O cliente reconheceu proativamente na reunião de wrap-up. O processo de QA que criei a partir disso foi adotado como padrão para todos os lançamentos do time.</p>
    <div class="tip"><strong>LP connection:</strong> "I didn't wait for the client to find the problem. It was their campaign, their revenue data — my job was to make sure it worked correctly."</div>` },

  { tag:'lp', q:'Dive Deep — história preparada',
    body:`<div class="ht"><span>Dive Deep</span><span>LP</span><span>data</span><span>analysis</span><span>root cause</span><span>discrepancy</span><span>detail</span></div>
    <div class="box amz"><div class="box-lbl">LP: Dive Deep — "Leaders operate at all levels, stay connected to the details"</div>
    Perguntas prováveis: "Tell me about a time you used data to find the root cause of a problem." / "Describe a situation where the surface-level answer was wrong."
    </div>
    <p style="font-size:13px;line-height:1.7"><strong>Situação:</strong> Em um cliente de e-commerce, o relatório de impressões da campanha mostrava 15% a menos no CM360 do que no publisher. O time queria aceitar como "normal discrepância" e seguir em frente.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Ação:</strong> Me recusei a encerrar sem entender o motivo. Cruzei os logs de ad calls, timestamps e taxas de aceitação de cookie por placement. Encontrei que um publisher específico estava contando ad calls antes do script de consent carregar — ou seja, impressões sendo contadas para usuários que ainda não tinham aceito, que nunca receberiam o pixel do CM360.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Resultado:</strong> Negociamos crédito de mídia com o publisher. Mais importante: documentei o padrão e adicionei verificação de consent como passo padrão do meu QA para todos os mercados com LGPD/GDPR-equivalent.</p>
    <div class="tip"><strong>LP connection:</strong> "The 15% discrepancy wasn't random noise — it was a signal. I needed to know what it was before accepting it."</div>` },

  { tag:'lp', q:'Earn Trust — história preparada',
    body:`<div class="ht"><span>Earn Trust</span><span>LP</span><span>trust</span><span>stakeholder</span><span>communication</span><span>difficult</span><span>client</span></div>
    <div class="box amz"><div class="box-lbl">LP: Earn Trust — "Leaders listen attentively, speak candidly, and treat others respectfully"</div>
    Perguntas prováveis: "Tell me about a time you had to rebuild trust with a client." / "Describe a situation where you delivered difficult news."
    </div>
    <p style="font-size:13px;line-height:1.7"><strong>Situação:</strong> Na EssenceMediacom, uma campanha de um cliente importante (Mars) entrou em ar com um placement configurado incorretamente — o targeting de audiência estava mais amplo do que o briefado. O erro foi meu na revisão final.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Ação:</strong> Comuniquei ao cliente antes que eles percebessem — não esperei serem questionados. Trouxe os dados do erro, o impacto estimado em orçamento despendido fora do target, e um plano de ajuste para recuperar o restante do flight. Não atribuí culpa a nenhum processo ou ferramenta.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Resultado:</strong> O cliente ficou satisfeito com a transparência. Mantivemos o relacionamento. Internamente, implementei uma segunda revisão de targeting por um colega antes de qualquer go-live — o erro não se repetiu.</p>
    <div class="tip"><strong>LP connection:</strong> "Trust comes from being honest when it's uncomfortable, not just when you have good news."</div>` },

  { tag:'lp', q:'Deliver Results — história preparada',
    body:`<div class="ht"><span>Deliver Results</span><span>LP</span><span>results</span><span>metrics</span><span>deadline</span><span>obstacle</span><span>outcome</span></div>
    <div class="box amz"><div class="box-lbl">LP: Deliver Results — "Leaders focus on key inputs and deliver with the right quality and in a timely fashion"</div>
    Perguntas prováveis: "Tell me about a time you delivered a result despite significant obstacles." / "Describe your most challenging deadline."
    </div>
    <p style="font-size:13px;line-height:1.7"><strong>Situação:</strong> Na StormX, fui responsável por criar um processo de reconciliação de dados de campanha que anteriormente levava 8+ horas manuais toda semana para o time produzir.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Ação:</strong> Mapeei todas as fontes de dados (plataformas, planilhas, exports), identifiquei os pontos de falha manual, e construí um Google Apps Script que conectava as fontes, validava automaticamente os dados, e gerava o relatório consolidado.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Resultado:</strong> O processo caiu de 8 horas para menos de 30 minutos de revisão — o script roda automaticamente. O time passou essas horas para análise e otimização em vez de reconciliação.</p>
    <div class="tip"><strong>LP connection:</strong> "Delivering results isn't just hitting the deadline — it's removing the obstacle so it doesn't block the next result too."</div>` },

  { tag:'lp', q:'Invent and Simplify — história preparada',
    body:`<div class="ht"><span>Invent and Simplify</span><span>LP</span><span>automation</span><span>process</span><span>efficiency</span><span>Apps Script</span><span>simplify</span></div>
    <div class="box amz"><div class="box-lbl">LP: Invent and Simplify — "Leaders expect and require innovation and always find ways to simplify"</div>
    Perguntas prováveis: "Tell me about a process you improved or invented." / "Describe a time you simplified something complex."
    </div>
    <p style="font-size:13px;line-height:1.7"><strong>Situação:</strong> Na EssenceMediacom, o processo de onboarding de novos anunciantes para CM360 era completamente manual — instruções em Word, chamadas de alinhamento, iterações de tag aprovação. Um onboarding típico levava 2–3 semanas.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Ação:</strong> Criei um guia estruturado de implementação de Floodlight — com checklist de verificação, exemplos de código, e critérios de aprovação claros — que o time de web do cliente pudesse seguir de forma independente. Adicionei uma planilha de QA compartilhada onde o status ficava visível para ambos os lados.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Resultado:</strong> O onboarding médio caiu para 5–7 dias. Reduziu significativamente o volume de chamadas de suporte durante o processo e ficou como documentação padrão do time.</p>
    <div class="tip"><strong>Connect para Amazon:</strong> "Voice of customer → product feedback" é uma das responsabilidades do PSC. Essa história mostra que você identifica fricção no processo e age para removê-la.</div>` },

  { tag:'prep', q:'Tell me about yourself — opening 60–90 seconds',
    body:`<div class="ht"><span>yourself</span><span>intro</span><span>opening</span><span>background</span><span>elevator</span><span>15 years</span><span>first question</span></div>
    <div class="tip"><strong>Structure: Past → Present → Why Amazon</strong></div>
    <p style="font-size:13px;line-height:1.7;white-space:pre-wrap">I've been in digital advertising operations for about 15 years, primarily on the agency side in Brazil. My core expertise is the Google Marketing Platform — DV360 and CM360 — but I've also worked extensively with Amazon DSP, which I'm certified in.

Most recently I've been at StormX, where I own campaign governance, data validation, and process automation. Before that, I was an AdOps Supervisor at EssenceMediacom, managing programmatic and display campaigns for brands like Samsung, Airbnb, Mars, and Reckitt — full ownership from trafficking through reporting.

What draws me to Amazon Ads specifically is the data layer. I've been pitching programmatic solutions to clients for years, and Amazon's first-party shopping signals are genuinely differentiated — there's nothing equivalent in the market for purchase-intent targeting. I want to work with that product and help clients use it effectively.</p>
    <div class="box todo"><div class="box-lbl">📝 Ajustar conforme o que souber do entrevistador</div>Se for a Paulina (Client Lead), enfatizar o client-facing e o training. Se for hiring manager técnico, enfatizar a profundidade em DSP e data.</div>` },

  { tag:'prep', q:'Why Amazon Ads? — motivation specific to this company',
    body:`<div class="ht"><span>why</span><span>motivation</span><span>Amazon</span><span>first-party</span><span>DSP</span><span>data</span><span>scale</span></div>
    <ul>
      <li><strong>O dado é genuinamente único.</strong> Amazon tem intenção de compra real — não proxy de interesse, não sinal social, mas histórico de o que as pessoas compram. Isso é o que falta na maioria das estratégias programáticas que eu vi na agência.</li>
      <li><strong>O papel é consultivo, não só operacional.</strong> Onboarding, training, influenciar produto — é o tipo de trabalho que cria impacto além da campanha em si. Quero construir isso.</li>
      <li><strong>Amazon tem estrutura para crescer.</strong> LPs, mentorship, o próprio rigor do processo de contratação — são sinais de uma empresa que investe em desenvolvimento de verdade.</li>
    </ul>
    <div class="tip"><strong>💡</strong> Avoid genérico. Não dizer "Amazon é uma empresa incrível." Dizer o que o produto resolve especificamente e por que você quer trabalhar com ele.</div>` },

  { tag:'tech', q:'Amazon DSP — your experience and what makes it different',
    body:`<div class="ht"><span>Amazon DSP</span><span>programmatic</span><span>first-party</span><span>shopping signals</span><span>certified</span><span>audience</span><span>DV360</span></div>
    <div class="box ok"><div class="box-lbl">✓ Certificação Amazon DSP — já listada no CV</div></div>
    <p style="font-size:13px;line-height:1.7"><strong>Experiência prática:</strong> Trabalhei com Amazon DSP em campanhas programáticas, utilizando os audience segments baseados em comportamento de compra e browsing. A integração com CM360 para tracking de conversão e atribuição é parte do setup.</p>
    <div class="doc-h3">O que diferencia o Amazon DSP dos outros</div>
    <div class="tbl-w"><table>
      <thead><tr><th>DSP</th><th>Sinal de audience</th><th>Ponto forte</th></tr></thead>
      <tbody>
        <tr><td><strong>Amazon DSP</strong></td><td>Intenção de compra (histórico de compra, searches, browsing no Amazon.com.br)</td><td>Lower-funnel targeting com intenção real</td></tr>
        <tr><td>DV360</td><td>Sinal Google (search, YouTube, Maps)</td><td>Escala, integração com Google stack</td></tr>
        <tr><td>Meta</td><td>Sinal social (interesses, conexões, comportamento no app)</td><td>Social targeting, awareness</td></tr>
      </tbody>
    </table></div>
    <div class="tip"><strong>Key argument para clientes:</strong> "Se você vende no Amazon.com.br ou quer alcançar pessoas que compram na Amazon, o DSP é o único DSP com sinal de intenção de compra verificada — não baseado em interesse declarado."</div>` },

  { tag:'tech', q:'Programmatic buying — open auction, PMP, Programmatic Guaranteed',
    body:`<div class="ht"><span>programmatic</span><span>open auction</span><span>PMP</span><span>deal</span><span>guaranteed</span><span>buying</span><span>inventory</span></div>
    <div class="tbl-w"><table>
      <thead><tr><th>Modelo</th><th>Como funciona</th><th>Quando usar</th></tr></thead>
      <tbody>
        <tr><td><strong>Open Auction (RTB)</strong></td><td>Leilão em tempo real, sem negociação prévia. Maior escala, menor controle de inventário.</td><td>Escala, awareness, prospecting amplo</td></tr>
        <tr><td><strong>PMP (Deal ID)</strong></td><td>Leilão privado com publishers selecionados. Deal ID negociado previamente.</td><td>Brand safety, inventário premium, audiences específicos</td></tr>
        <tr><td><strong>Programmatic Guaranteed</strong></td><td>Compra garantida de impressões a CPM fixo, via deal. Sem leilão.</td><td>Branding de alto impacto, reserva de inventário premium</td></tr>
      </tbody>
    </table></div>
    <p style="font-size:13px;line-height:1.7">No Amazon DSP, os deals com Amazon Publisher Services (APS) dão acesso a inventário Amazon.com.br premium — acima do que está disponível em open auction. Para campanhas de lançamento de produto no Brazil, PMP via APS é geralmente a recomendação.</p>` },

  { tag:'tech', q:'Training a client on Amazon DSP — how would you approach onboarding?',
    body:`<div class="ht"><span>training</span><span>onboarding</span><span>client</span><span>trading desk</span><span>DSP</span><span>adoption</span><span>enablement</span></div>
    <div class="box info"><div class="box-lbl">ℹ️ Core responsibility do PSC role</div>
    Este é literalmente o que o papel faz — onboarding, training, deep dives. Prepare uma resposta estruturada.
    </div>
    <p style="font-size:13px;line-height:1.7">Meu approach de onboarding tem 3 fases:</p>
    <div class="steps">
      <div class="step"><div class="sn">1</div><div class="sb"><strong>Discovery</strong> — Entender o cliente antes de mostrar qualquer ferramenta. O que eles vendem? Quais KPIs são prioritários? Qual a maturidade deles em programmatic? Um trading desk experiente precisa de profundidade técnica; um anunciante novo precisa de fundamentos primeiro.</div></div>
      <div class="step"><div class="sn">2</div><div class="sb"><strong>Hands-on + documentação</strong> — Walkthrough na plataforma com casos reais do cliente, não demos genéricos. Documento cada setup para que o cliente possa replicar de forma independente. O objetivo é autonomia, não dependência de mim.</div></div>
      <div class="step"><div class="sn">3</div><div class="sb"><strong>Revisão + otimização</strong> — Após as primeiras campanhas ao vivo, sessão de análise de resultados: o que funcionou, o que otimizar, como ler os relatórios de forma que façam sentido para o negócio deles.</div></div>
    </div>
    <div class="tip"><strong>EssenceMediacom connection:</strong> Fiz onboarding técnico de Floodlight para o time de web de múltiplos clientes — Samsung, Airbnb, etc. O mesmo approach: discovery → hands-on → autonomia.</div>` },

  { tag:'tech', q:'Voice of customer — how do you turn client feedback into product input?',
    body:`<div class="ht"><span>voice of customer</span><span>product</span><span>feedback</span><span>engineering</span><span>feature request</span><span>advocate</span><span>PSC</span></div>
    <div class="box info"><div class="box-lbl">ℹ️ Uma das responsabilidades explícitas do papel</div>
    "Act as the internal voice of the customer to help drive product enhancements."
    </div>
    <p style="font-size:13px;line-height:1.7">O que aprendi na prática: feedback não estruturado não muda produto. Para ter peso interno, o input precisa ser:</p>
    <ul>
      <li><strong>Quantificado:</strong> "3 de 5 clientes tiveram dificuldade com X" é mais acionável que "clientes reclamam de X."</li>
      <li><strong>Com impacto de negócio:</strong> "Essa limitação está bloqueando R$X em spend" chama atenção de PM.</li>
      <li><strong>Com workaround documentado:</strong> Mostra que você já tentou resolver no lado do cliente e chegou em um limite real de produto.</li>
    </ul>
    <p style="font-size:13px;line-height:1.7">Na prática: eu manteria um log de friction points por cliente, consolidaria mensalmente, e priorizaria para apresentar aos PMs com esse formato estruturado.</p>` },

  { tag:'situacional', q:'Tell me about a time you helped a client adopt a new technology or platform',
    body:`<div class="ht"><span>adoption</span><span>training</span><span>client</span><span>new tech</span><span>onboarding</span><span>CM360</span><span>Floodlight</span></div>
    <p style="font-size:13px;line-height:1.7"><strong>Situação:</strong> Na EssenceMediacom, um novo cliente (Airbnb) vinha de uma stack diferente — não tinha experiência com Floodlight nem com CM360. A conta tinha campanhas planejadas para 3 mercados em 60 dias.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Ação:</strong> Criei um plano de onboarding em 3 semanas: semana 1 fundamentals (como o Floodlight funciona, o que é necessário implementar), semana 2 implementação assistida com o time web deles, semana 3 verificação e primeiro go-live. Documentei tudo em um guia que o time deles poderia usar de forma independente.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Resultado:</strong> Primeira campanha live dentro do prazo, com tracking completo. O cliente replicou o processo de forma autônoma para os mercados seguintes sem precisar de suporte adicional.</p>
    <div class="tip"><strong>LP mapeado:</strong> Customer Obsession + Invent and Simplify</div>` },

  { tag:'situacional', q:'Tell me about a time you managed a difficult client relationship',
    body:`<div class="ht"><span>difficult</span><span>client</span><span>relationship</span><span>trust</span><span>communication</span><span>resolution</span><span>stakeholder</span></div>
    <p style="font-size:13px;line-height:1.7"><strong>Situação:</strong> Um cliente (Reckitt) estava insatisfeito com discrepâncias recorrentes entre os dados que reportávamos e os dados internos deles. O relacionamento estava tenso — eles chegaram a questionar a confiabilidade de toda a nossa operação.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Ação:</strong> Em vez de tentar resolver por email, pedi uma reunião dedicada só para o tema de discrepâncias. Cheguei com uma análise completa das últimas 3 campanhas: origem de cada gap, causa raiz, e o que estava sendo feito diferente do acordado no setup inicial. Propus um protocolo compartilhado de reconciliação — uma planilha que ambos os lados alimentariam e que ficaria como fonte única de verdade.</p>
    <p style="font-size:13px;line-height:1.7"><strong>Resultado:</strong> O cliente adotou o protocolo. As reuniões de status passaram a ser mais objetivas porque a base de dados era a mesma. O relacionamento melhorou significativamente no semestre seguinte.</p>
    <div class="tip"><strong>LP mapeado:</strong> Earn Trust + Dive Deep</div>` },

  { tag:'comportamental', q:'How do you work with Product and Engineering teams as a client proxy?',
    body:`<div class="ht"><span>product</span><span>engineering</span><span>cross-functional</span><span>client proxy</span><span>feedback</span><span>internal</span><span>stakeholder</span></div>
    <p style="font-size:13px;line-height:1.7">Minha abordagem é ser um tradutor — o cliente fala em termos de negócio, o time de produto fala em termos de feature e roadmap. Meu papel é transformar "o cliente está tendo dificuldade com X" em "X bloqueia Y casos de uso, afeta Z% do nosso base de clientes, e o workaround atual tem este custo operacional."</p>
    <p style="font-size:13px;line-height:1.7">Na prática, isso exige que eu conheça o produto bem o suficiente para saber o que é um gap real de produto versus uma questão de adoção ou treinamento. Não adianta escalar para Engineering algo que se resolve com uma configuração diferente no dashboard.</p>
    <div class="tip"><strong>LP mapeado:</strong> Have Backbone (defender o cliente internamente) + Dive Deep (entender se é produto ou uso)</div>` },

  { tag:'comportamental', q:'What do you consider your strongest area in programmatic advertising?',
    body:`<div class="ht"><span>strength</span><span>programmatic</span><span>CM360</span><span>DV360</span><span>troubleshoot</span><span>integration</span><span>expertise</span></div>
    <p style="font-size:13px;line-height:1.7">A integração entre ad server e DSP — especificamente CM360 + DV360, e como investigar quando eles não concordam. Muitos profissionais operam um ou o outro, mas a dificuldade real fica na interseção: discrepâncias de impressão, atribuição de conversão via Floodlight, audience sharing entre plataformas.</p>
    <p style="font-size:13px;line-height:1.7">Para o papel de PSC na Amazon, isso se traduz em conseguir ajudar clientes a entender por que os dados do Amazon DSP podem diferir do seu ad server, e onde fica cada fonte de verdade em diferentes cenários de atribuição.</p>` },

  { tag:'salario', q:'Salary expectation — Amazon Ads context',
    body:`<div class="ht"><span>salary</span><span>Amazon</span><span>CLT</span><span>compensation</span><span>range</span><span>negotiate</span><span>RSU</span></div>
    <div class="box warn"><div class="box-lbl">🎯 Amazon tem bandas salariais fixas — pesquise antes</div>
    Amazon usa job levels (L4, L5, L6 etc.) com bandas pré-definidas. PSC provavelmente é L5 ou L6. A Amazon tende a ter base competitiva + RSU (Restricted Stock Units) no pacote total. Confirmar com Paulina se RSU existe para a operação BR.
    </div>
    <div class="tbl-w"><table>
      <thead><tr><th>Scenario</th><th>Response</th></tr></thead>
      <tbody>
        <tr><td>Paulina pergunta expectativa</td><td>Primeiro perguntar sobre a estrutura de compensação total — base + RSU + benefícios. Depois: "Estou buscando algo na faixa de R$12–15k base, mas o pacote completo é o que importa."</td></tr>
        <tr><td>Oferta abaixo do target</td><td>Verificar se tem RSU. RSU de empresa pública (Amazon) com 4-year vesting pode valer muito. Calcular o total antes de recusar.</td></tr>
        <tr><td>Presencialidade 5x — negociação</td><td>Confirmar se há flexibilidade ou se é hard requirement. Se for hard, avaliar o trade-off antes de continuar o processo.</td></tr>
      </tbody>
    </table></div>
    <div class="box todo"><div class="box-lbl">📝 Pesquisar</div>Levels.fyi ou LinkedIn Salary para "Amazon L5 Programmatic Solutions Consultant Brasil" — para ter referência de mercado antes da conversa de oferta.</div>` },

  { tag:'abertas', q:'Questions to ask Paulina — recruiter screen intel gathering',
    body:`<div class="ht"><span>questions</span><span>ask</span><span>Paulina</span><span>recruiter</span><span>intel</span><span>team</span><span>structure</span></div>
    <div class="box warn"><div class="box-lbl">🎯 Deixa ela falar primeiro — coleta intel</div></div>
    <ul>
      <li>Can you tell me more about the team structure — how many PSCs are on the Brazil team right now?</li>
      <li>Who would I report to, and what's their background?</li>
      <li>What does the client portfolio look like — more agencies or direct advertisers?</li>
      <li>How is the 5-day office requirement structured — is it flexible for some situations?</li>
      <li>What does the compensation structure look like — base, RSU, benefits?</li>
      <li>What's the typical next step after this screen?</li>
      <li>What would success look like in the first 90 days for someone in this role?</li>
    </ul>` },

  { tag:'abertas', q:'Notes after recruiter screen — debrief',
    body:`<div class="ht"><span>notes</span><span>debrief</span><span>after</span><span>next steps</span><span>Paulina</span><span>improve</span></div>
    <div class="box todo"><div class="box-lbl">📝 Preencher logo após a call</div></div>
    <div class="doc-h3">O que foi bem</div>
    <ul><li>[...]</li></ul>
    <div class="doc-h3">Perguntas que peguiram ou que não estava preparado</div>
    <ul><li>[...]</li></ul>
    <div class="doc-h3">Próximos passos que eles disseram</div>
    <p>[TIMELINE, QUEM RETORNA, FORMATO DA PRÓXIMA ETAPA]</p>
    <div class="doc-h3">LPs que foram mencionados ou implícitos</div>
    <p>[QUAIS LPS APARECERAM — REFORÇAR PARA O LOOP]</p>
    <div class="doc-h3">Sensação sobre a presencialidade 5x</div>
    <p>[É hard requirement ou flexível? Isso muda o cálculo de aceitar?]</p>` },

];

// ── render ──
const tagLabel = {
  empresa:'Company', prep:'Prep', tech:'Technical',
  situacional:'Situational', comportamental:'Behavioral',
  salario:'Salary', abertas:'Open Qs', lp:'Amazon LP'
};

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hi(s,q){if(!q)return s;const r=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');return s.replace(r,'<mark>$1</mark>')}

let activeFilter='all', searchQ='';

function render(){
  const feed=document.getElementById('feed');
  const q=searchQ.trim().toLowerCase();
  const filtered=ITEMS.filter(it=>{
    const tagOk=activeFilter==='all'||it.tag===activeFilter;
    const qOk=!q||it.q.toLowerCase().includes(q)||it.body.toLowerCase().includes(q);
    return tagOk&&qOk;
  });
  document.getElementById('count').textContent=filtered.length+' card'+(filtered.length!==1?'s':'');
  if(!filtered.length){feed.innerHTML='<div class="empty">No cards match.</div>';return;}
  feed.innerHTML=filtered.map((it,i)=>{
    const cls=`t-${it.tag}`;
    const lbl=tagLabel[it.tag]||it.tag;
    const isTodo=it.body.includes('class="box todo"');
    return`<div class="card${isTodo?' todo-card':''}" id="c${i}">
      <div class="ch" onclick="toggle('c${i}')">
        <span class="ctag ${cls}">${lbl}</span>
        <span class="cq">${hi(esc(it.q),q)}</span>
        <svg class="chev" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
      </div>
      <div class="cb">${it.body}</div>
    </div>`;
  }).join('');
}

function toggle(id){
  const c=document.getElementById(id);
  if(c)c.classList.toggle('open');
}

function clearQ(){
  document.getElementById('q').value='';
  searchQ='';
  document.getElementById('clr').style.display='none';
  render();
}

document.getElementById('q').addEventListener('input',e=>{
  searchQ=e.target.value;
  document.getElementById('clr').style.display=searchQ?'block':'none';
  render();
});

document.getElementById('filters').addEventListener('click',e=>{
  const btn=e.target.closest('.fb');
  if(!btn)return;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  activeFilter=btn.dataset.f;
  render();
});

render();
</script>
