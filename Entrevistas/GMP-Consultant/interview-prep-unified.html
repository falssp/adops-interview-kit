<!doctype html>
<title>GMP Consultant — Prep</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg:     #F5F4F1;
  --surf:   #FFFFFF;
  --bdr:    #E4E2DB;
  --fg:     #1A1916;
  --fg2:    #6A6760;
  --fg3:    #A09D97;
  --acc:    #1A52A0;
  --acc-bg: #EAF1FB;
  --grn:    #167A45;
  --grn-bg: #EDF7F2;
  --warn:   #B85C00;
  --warn-bg:#FEF3E8;
  --tag-bg: #F0EEEA;
  --cad:    #E84534;
  --cad-bg: #FEF0EE;
  --t-gmp:        #1B5CCC; --t-gmp-bg:   #EBF0FB;
  --t-ana:        #0F7756; --t-ana-bg:   #ECFDF5;
  --t-com:        #7C3AED; --t-com-bg:   #F5F3FF;
  --t-sit:        #B45309; --t-sit-bg:   #FFFBEB;
  --t-sal:        #C41E3A; --t-sal-bg:   #FFF1F2;
  --t-doc:        #5B7FA6; --t-doc-bg:   #EEF3F9;
  --t-cm:         #0070C0; --t-cm-bg:    #E6F2FF;
  --t-dv:         #1A7A4A; --t-dv-bg:    #E6F7EE;
  --t-sa:         #7B3FA0; --t-sa-bg:    #F3ECFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#111110; --surf:#1A1917; --bdr:#2C2B27;
  --fg:#EDEBE6; --fg2:#A09D97; --fg3:#615E58;
  --acc:#5B9CF6; --acc-bg:#0D1E38;
  --grn:#3ECF7A; --grn-bg:#0C2419;
  --warn:#F49240; --warn-bg:#2A1700;
  --tag-bg:#222118; --cad:#F87171; --cad-bg:#2A0A0A;
  --t-gmp:#5B8DEF; --t-gmp-bg:#1C2540;
  --t-ana:#34D399; --t-ana-bg:#064E3B;
  --t-com:#A78BFA; --t-com-bg:#2E1065;
  --t-sit:#FBBF24; --t-sit-bg:#451A03;
  --t-sal:#F87171; --t-sal-bg:#450A0A;
  --t-doc:#7BA7D4; --t-doc-bg:#0F1E30;
  --t-cm:#4DA8FF;  --t-cm-bg:#0A1E36;
  --t-dv:#4CD98A;  --t-dv-bg:#0A2318;
  --t-sa:#C084FC;  --t-sa-bg:#1E0A36;
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg:#111110; --surf:#1A1917; --bdr:#2C2B27;
  --fg:#EDEBE6; --fg2:#A09D97; --fg3:#615E58;
  --acc:#5B9CF6; --acc-bg:#0D1E38;
  --grn:#3ECF7A; --grn-bg:#0C2419;
  --warn:#F49240; --warn-bg:#2A1700;
  --tag-bg:#222118; --cad:#F87171; --cad-bg:#2A0A0A;
  --t-gmp:#5B8DEF; --t-gmp-bg:#1C2540;
  --t-ana:#34D399; --t-ana-bg:#064E3B;
  --t-com:#A78BFA; --t-com-bg:#2E1065;
  --t-sit:#FBBF24; --t-sit-bg:#451A03;
  --t-sal:#F87171; --t-sal-bg:#450A0A;
  --t-doc:#7BA7D4; --t-doc-bg:#0F1E30;
  --t-cm:#4DA8FF;  --t-cm-bg:#0A1E36;
  --t-dv:#4CD98A;  --t-dv-bg:#0A2318;
  --t-sa:#C084FC;  --t-sa-bg:#1E0A36;
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.65;background:var(--bg);color:var(--fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* TOP BAR */
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surf);border-bottom:1px solid var(--bdr);z-index:20;padding:0 24px}
.bar-inner{max-width:1400px;margin-inline:auto;display:flex;align-items:center;gap:12px;height:56px}
.brand{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:20px;background:var(--cad-bg);color:var(--cad);margin-left:5px;vertical-align:middle}
.search-wrap{flex:1;min-width:0;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--fg3);pointer-events:none}
#q{width:100%;padding:8px 36px 8px 32px;border:1.5px solid var(--bdr);border-radius:8px;background:var(--surf);color:var(--fg);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:var(--fg3)}
.clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--fg3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
#count{font-size:12px;color:var(--fg3);white-space:nowrap}

/* FILTERS */
.filters{max-width:1400px;margin-inline:auto;padding:10px 24px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--bdr)}
.fb{padding:4px 11px;border-radius:20px;border:1.5px solid var(--bdr);background:transparent;color:var(--fg3);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--acc);color:var(--acc)}
.fb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fb[data-f="cm360"].on{background:var(--t-cm);border-color:var(--t-cm)}
.fb[data-f="dv360"].on{background:var(--t-dv);border-color:var(--t-dv)}
.fb[data-f="sa360"].on{background:var(--t-sa);border-color:var(--t-sa)}

/* CARDS */
.feed{max-width:1400px;margin-inline:auto;padding:16px 24px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:10px;align-items:start}
.card{background:var(--surf);border:1.5px solid var(--bdr);border-radius:10px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:var(--acc)}
.ch{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.ctag{flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:4px;margin-top:2px}
.t-gmp          {background:var(--t-gmp-bg);color:var(--t-gmp)}
.t-analytics    {background:var(--t-ana-bg);color:var(--t-ana)}
.t-comportamental{background:var(--t-com-bg);color:var(--t-com)}
.t-situacional  {background:var(--t-sit-bg);color:var(--t-sit)}
.t-salario      {background:var(--t-sal-bg);color:var(--t-sal)}
.t-doc          {background:var(--t-doc-bg);color:var(--t-doc)}
.t-cm360        {background:var(--t-cm-bg);color:var(--t-cm)}
.t-dv360        {background:var(--t-dv-bg);color:var(--t-dv)}
.t-sa360        {background:var(--t-sa-bg);color:var(--t-sa)}
.cq{flex:1;min-width:0;font-size:14px;font-weight:600}
.chev{flex-shrink:0;width:18px;height:18px;color:var(--fg3);transition:transform .2s;margin-top:2px}
.card.open .chev{transform:rotate(180deg)}
.cb{display:none;padding:0 16px 16px;border-top:1px solid var(--bdr);padding-top:14px}
.card.open .cb{display:block}

/* body content inside cards */
.cb p{margin-bottom:10px;font-size:14px;max-width:65ch}
.cb p:last-child{margin-bottom:0}
.cb ul,.cb ol{padding-left:20px;margin-bottom:10px}
.cb li{margin-bottom:3px;font-size:13px}
.cb strong{font-weight:600}
.cb code{font-size:.85em;background:var(--tag-bg);padding:1px 5px;border-radius:3px}
.cb pre{background:var(--tag-bg);padding:12px;border-radius:6px;overflow-x:auto;font-size:12px;margin-bottom:10px}
.ans{font-size:14px;line-height:1.7;white-space:pre-wrap}
.tip{margin-top:10px;padding:8px 12px;background:var(--grn-bg);border-left:3px solid var(--grn);border-radius:0 6px 6px 0;font-size:13px}
.tip strong{color:var(--grn)}
.box{border-radius:8px;padding:12px 14px;margin:10px 0;font-size:13px;line-height:1.6}
.box-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.box.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.box.info{background:var(--acc-bg);color:var(--acc);border:1px solid var(--acc)}
.box.ok{background:var(--grn-bg);color:var(--grn);border:1px solid var(--grn)}
.box.tip2{background:var(--surf);color:var(--fg);border:1px solid var(--bdr)}
.box strong{color:inherit}
.steps{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.sn{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.sb{flex:1;min-width:0}
.sb strong{display:block;font-weight:600;margin-bottom:1px}
.tbl-w{overflow-x:auto;margin-bottom:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--tag-bg);color:var(--fg2);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;text-align:left;border-bottom:1px solid var(--bdr)}
td{padding:8px 10px;border-bottom:1px solid var(--bdr);vertical-align:top}
tr:last-child td{border-bottom:none}
.green{color:var(--grn);font-weight:600}
.med{color:var(--warn);font-weight:600}
.muted{color:var(--fg3)}

/* section headers inside doc cards */
.doc-h{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bdr)}
.doc-h3{font-size:14px;font-weight:600;margin:16px 0 8px}

/* empty */
.empty{text-align:center;color:var(--fg3);padding:48px;font-size:14px}

/* highlight */
mark{background:#FEF08A;color:#1A1916;border-radius:2px;padding:0 1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{background:#7C6800;color:#EDEBE6}}
:root[data-theme="dark"] mark{background:#7C6800;color:#EDEBE6}

@media(max-width:480px){
  .bar-inner{gap:8px}
  .brand{font-size:13px}
  #count{display:none}
}
</style>

<div class="bar">
  <div class="bar-inner">
    <div class="brand">GMP Consultant <span class="pill">Prep</span></div>
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/></svg>
      <input id="q" type="search" placeholder="Buscar pergunta, tema ou palavra-chave…" autocomplete="off">
      <button class="clr" id="clr" style="display:none" onclick="clearQ()">✕</button>
    </div>
    <span id="count"></span>
  </div>
</div>

<div class="filters" id="filters">
  <button class="fb on" data-f="all">Todas</button>
  <button class="fb" data-f="doc">Contexto</button>
  <button class="fb" data-f="gmp">GMP</button>
  <button class="fb" data-f="cm360">CM360</button>
  <button class="fb" data-f="dv360">DV360</button>
  <button class="fb" data-f="sa360">SA360</button>
  <button class="fb" data-f="analytics">Analytics</button>
  <button class="fb" data-f="situacional">Situacional</button>
  <button class="fb" data-f="comportamental">Comportamental</button>
  <button class="fb" data-f="salario">Salário</button>
</div>

<div class="feed" id="feed"></div>

<script>
const ITEMS = [
  // ── GMP ──
  { tag:'gmp', q:'Como você descreve sua experiência com o ecossistema GMP?',
    body:`<div class="ans">Tenho mais de 6 anos de experiência prática com as três principais plataformas do GMP. Minha maior profundidade é no CM360 — trafficking completo, configuração de Floodlights, variáveis customizadas, relatórios de atribuição e governança de taxonomia para grandes contas em agências WPP e Omnicom.\n\nNo DV360 atuei na execução de campanhas programáticas integradas ao CM360. No SA360 meu uso foi mais consultivo: acompanhamento de campanhas de search e integração com CM360 para mensuração unificada.</div><div class="tip"><strong>💡</strong> Mencione que CM360 é o núcleo do seu stack e que DV360 e SA360 estão integrados a ele — mostra visão de ecossistema, não de ferramenta isolada.</div>` },
  { tag:'gmp', q:'Me fale sobre sua experiência com Floodlights e mensuração.',
    body:`<div class="ans">Trabalho com Floodlights há mais de 6 anos:\n• Definição de atividades por objetivo (venda, lead, engajamento)\n• Configuração de u-variables para dados transacionais\n• Implementação via GTM e validação com Tag Assistant\n• Troubleshooting de discrepâncias entre CM360 e plataformas de destino\n• Auditoria e governança contínua da arquitetura de tags\n\nNas agências era a referência técnica de Floodlight — qualquer discrepância ou implementação nova passava por mim.</div><div class="tip"><strong>💡</strong> Se perguntarem sobre integração offline: mencione apoio à revisão de arquitetura integrando CM360, GA4 e BigQuery — sem citar empresa ou cliente.</div>` },
  { tag:'gmp', q:'Qual a diferença entre um Floodlight de venda e um de engajamento?',
    body:`<div class="ans">Um Floodlight de <strong>venda (transaction)</strong> captura o valor da transação e quantidade — evento com valor financeiro, como uma compra. Você configura Revenue e Quantity.\n\nUm Floodlight de <strong>engajamento (counter)</strong> conta ocorrências sem valor atrelado — cadastro, download, clique em botão. Você escolhe o método de contagem (standard, unique, per session).\n\nNa prática: defino o tipo, as u-variables para dados extras e implemento via GTM com templates nativos do CM360, sempre validando no Tag Assistant antes de subir para produção.</div><div class="tip"><strong>💡</strong> Demonstre que você sabe a diferença de uso de negócio, não só a técnica.</div>` },
  { tag:'gmp', q:'Como você faria o mapeamento e auditoria de Floodlights com conversões offline?',
    body:`<div class="steps"><div class="step"><div class="sn">1</div><div class="sb"><strong>Inventário</strong> Exportar lista completa de Floodlight Activities — nome, tipo (Counter/Sales), formato (GTM/tag direta), status (ativo/sem dados 30d).</div></div><div class="step"><div class="sn">2</div><div class="sb"><strong>Validação técnica</strong> Tag Diagnostics do CM360 para erros; verificar Custom Variables (u1, u2...) e deduplication key.</div></div><div class="step"><div class="sn">3</div><div class="sb"><strong>Conversões offline</strong> Mapear fluxo: evento online gera GCLID → CRM captura → venda offline → upload recorrente via SA360 ou API. Sem GCLID no CRM, a integração não funciona.</div></div><div class="step"><div class="sn">4</div><div class="sb"><strong>Entregável</strong> Planilha com status de cada Floodlight, ação recomendada (manter/pausar/recriar) e prioridade.</div></div></div>` },
  { tag:'gmp', q:'Como você estrutura a governança de taxonomia em uma conta GMP?',
    body:`<div class="ans">A governança começa antes de subir qualquer campanha:\n\n1. Definir a hierarquia: Advertiser > Campaign > Placement > Ad, com padrão documentado\n2. Criar o naming convention com campos obrigatórios (marca, produto, período, formato, canal, segmentação)\n3. Documentar em guia compartilhado com todos os envolvidos\n4. Criar checklists de QA antes de go-live\n5. Auditar periodicamente para identificar desvios\n\nEm agências de rede isso era crítico — campanhas multi-mercado com dezenas de placements. Um erro de nomenclatura comprometia o relatório inteiro.</div><div class="tip"><strong>💡</strong> Mencione a ferramenta de automação de nomenclatura em Apps Script — exemplo concreto.</div>` },
  { tag:'gmp', q:'Como estruturar a governança de uma conta GMP do zero para um cliente enterprise?',
    body:`<p><strong>Estrutura de contas:</strong> espelhar hierarquia entre CM360, DV360 e SA360 — 1 Network/Partner/Manager Account → Advertisers por marca → Campaigns por objetivo.</p><p><strong>Taxonomia:</strong> definir padrão antes de criar qualquer elemento: <code>[Marca]_[Objetivo]_[Canal]_[Formato]_[Data]</code>. Documentar e exigir aprovação para desvios.</p><p><strong>Permissões:</strong> menor privilégio — read-only (cliente), editor (agência), admin (consultor/parceiro). Auditar a cada trimestre.</p><p><strong>Documentação:</strong> Floodlight map + runbook de operação com SLAs e processos de aprovação.</p>` },
  { tag:'gmp', q:'Quando o SA360 se justifica frente ao Google Ads nativo?',
    body:`<p>SA360 se justifica quando o cliente tem complexidade que o Google Ads nativo não resolve:</p><ul><li><strong>Múltiplas engines:</strong> Google Ads + Microsoft Advertising + Yahoo Japan em uma interface</li><li><strong>Smart Bidding cross-conta:</strong> lances otimizados considerando portfólio inteiro, com Floodlight como sinal de conversão unificado</li><li><strong>Inventory Management:</strong> cria e pausa anúncios automaticamente baseado em feed de produto/estoque</li><li><strong>Exportação para BigQuery via Reporting API</strong> — mais granular que o Google Ads nativo</li></ul><p><strong>Quando NÃO vale:</strong> cliente só com Google Ads, budget pequeno e sem necessidade de automação avançada — custo de licença não se justifica.</p>` },
  { tag:'gmp', q:'Como o Path to Conversion do CM360 apoia decisões de atribuição?',
    body:`<p>O P2C mostra a sequência de touchpoints antes da conversão — quais canais aparecem no topo, meio e fundo do funil.</p><p><strong>Como usar:</strong> calcular o Assisted Conversion Rate de cada canal. Se Display aparece muito no meio do funil mas recebe pouco crédito no last-click → está sendo subfinanciado. Base para migrar para DDA.</p><div class="box warn"><div class="box-lbl">⚠️ Limitação</div>O P2C só captura touchpoints de ads servidos via CM360 — não vê search orgânico, social fora do GMP nem email. Mencionar isso demonstra maturidade.</div>` },
  { tag:'gmp', q:'Você tem certificações Google ativas?',
    body:`<div class="ans">Tenho certificações em CM360 e Google Ads. Algumas estão com a renovação pendente, mas mantenho o conhecimento técnico atualizado no dia a dia.\n\nSe a posição exige certificações ativas, posso revalidá-las rapidamente — o conteúdo não é novidade para mim, é só formalizar.</div><div class="tip"><strong>💡</strong> Seja direto e não tente esconder. Oferecer-se para revalidar mostra proatividade.</div>` },
  { tag:'gmp', q:'Como conduzir o onboarding de um cliente migrando para o CM360?',
    body:`<div class="steps"><div class="step"><div class="sn">1</div><div class="sb"><strong>Discovery (sem. 1–2)</strong> Entender setup atual, fluxo de criativos, conversões rastreadas, publishers, dependências.</div></div><div class="step"><div class="sn">2</div><div class="sb"><strong>Setup técnico (sem. 2–4)</strong> Criar estrutura CM360, implementar Floodlights, configurar Custom Variables. Rodar os dois ad servers em paralelo por 2–4 semanas.</div></div><div class="step"><div class="sn">3</div><div class="sb"><strong>Operação assistida (mês 2)</strong> Trafegar primeiras campanhas junto com o time do cliente — não por eles. Treinar em Report Builder e troubleshooting. Estabelecer SLAs.</div></div><div class="step"><div class="sn">4</div><div class="sb"><strong>Handoff (mês 3+)</strong> Documentar runbook e Floodlight map. Desligar ad server antigo após dados estáveis.</div></div></div>` },

  // ── ANALYTICS ──
  { tag:'analytics', q:'Quais ferramentas de analytics você domina?',
    body:`<div class="ans">• Google Analytics 4 — análise de comportamento, eventos, conversões e atribuição\n• Looker Studio — dashboards customizados conectados a CM360, GA4 e Sheets\n• CM360 Reports — relatórios avançados de ad serving, path to conversion, atribuição multicanal\n• Google Tag Manager — implementação e gestão de tags, triggers e variáveis\n• BigQuery — leitura de queries e apoio a times de dados em projetos de mensuração\n\nNas agências era responsável pelos templates de relatório mensais em Looker Studio, integrando CM360 com GA4 para mostrar o funil completo.</div><div class="tip"><strong>💡</strong> Não force BigQuery se não for sólido — "leitura e apoio" é honesto e suficiente para esse papel consultivo.</div>` },
  { tag:'analytics', q:'Como você abordaria uma discrepância entre os números do CM360 e do GA4?',
    body:`<div class="ans">Primeiro mapeio as possíveis causas em ordem de probabilidade:\n\n1. Diferença de metodologia (last-click vs. impressão-based no CM360)\n2. Latência de dados — CM360 e GA4 processam em janelas diferentes\n3. Filtros aplicados incorretamente\n4. Problema de implementação de tag (GA4 não disparando em certas páginas)\n5. Bloqueadores de ad ou ITP em browsers\n\nMeu processo: criar um período de comparação controlado, checar os totais brutos, isolar a fonte. Se for técnico, resolvo e comunico proativamente com diagnóstico completo.\n\nNa maioria das vezes é metodologia — a discrepância de 10–20% entre CM360 e GA4 é esperada.</div><div class="tip"><strong>💡</strong> Mostrar que discrepância normal existe é mais maduro do que sugerir que os números têm que bater 100%.</div>` },
  { tag:'analytics', q:'Como integrar CM360/DV360 com GA4 e BigQuery para visão unificada?',
    body:`<ul><li><strong>Floodlight ↔ GA4:</strong> link via "Linked Accounts" no CM360 — conversões Floodlight ficam visíveis como eventos no GA4</li><li><strong>DV360 ↔ BigQuery:</strong> Data Transfer exporta impression_v2, click_v2, activity_v2 em nível de usuário</li><li><strong>GA4 ↔ BigQuery:</strong> export nativo, tabela diária events_YYYYMMDD</li><li><strong>Unificação:</strong> tabela mestre no BigQuery cruzando GCLID/DCLID entre as fontes → Looker Studio com métricas unificadas</li></ul>` },

  // ── SITUACIONAL ──
  { tag:'situacional', q:'Como você recomendaria para um cliente qual plataforma GMP usar?',
    body:`<div class="ans">A recomendação começa com: qual é o objetivo principal e de onde vem o inventário?\n\n• Mensuração unificada + múltiplos canais → CM360 é o hub central\n• Volume de mídia programática relevante + controle de audiências → DV360 integrado ao CM360\n• Search com alto volume + automação de lances → SA360\n\nNa prática a maioria dos clientes com budget relevante acaba num stack combinado. Meu papel é ajudar a entender qual combinação faz sentido — sem vender complexidade desnecessária.</div><div class="tip"><strong>💡</strong> Para o papel consultivo: demonstre que você pensa em solução, não em produto.</div>` },
  { tag:'situacional', q:'Você está assumindo uma conta em operação com outra agência. Como faz a migração?',
    body:`<div class="ans">Começo com um audit completo antes de tocar em qualquer coisa:\n\n1. Mapear toda a estrutura: campanhas, placements, anunciantes, Floodlights configurados\n2. Documentar o que existe vs. o que deveria existir segundo boas práticas GMP\n3. Identificar tags com erro ou que pararam de disparar\n4. Entender o histórico de performance\n5. Alinhar com o cliente as prioridades\n\nA migração de conta GMP tem risco real de perda de dados históricos. Regra: nunca deletar nada nas primeiras semanas — arquivar e documentar, sim. Deletar, só com confirmação do cliente e backup.</div><div class="tip"><strong>💡</strong> Demonstrar cautela na migração é sinal de senioridade. Consultores júnior entram reformando tudo; sênior entram mapeando.</div>` },
  { tag:'situacional', q:'Um cliente reclama que as conversões caíram 40% no mês. Como você investiga?',
    body:`<div class="ans">Antes de entrar em pânico com o cliente, faço a triagem técnica:\n\n1. Verifico se há quebra de implementação — Floodlight com erro, tag removida do site\n2. Comparo no DebugView do GA4 e no Tag Assistant se os eventos estão chegando\n3. Olho o histórico de mudanças no GTM — alguma publicação recente?\n4. Verifico se houve mudança no funil do site do cliente\n5. Comparo com o período equivalente do ano anterior para sazonalidade\n\nNa maioria dos casos é um dos três primeiros. Se for técnico, resolvo e comunico com diagnóstico completo.</div><div class="tip"><strong>💡</strong> Mostre que você separa problema técnico de problema de negócio.</div>` },
  { tag:'situacional', q:'Como você equilibra múltiplos clientes com demandas simultâneas?',
    body:`<div class="ans">Meu sistema de priorização tem três níveis:\n\n1. Urgente e impactando entrega ativa — atendo imediatamente\n2. Prazo combinado com cliente — bloco na agenda, não deixo acumular\n3. Otimizações e melhorias contínuas — executo em janelas reservadas\n\nUso Asana para gestão de demandas e Sheets para controle de status. Em agência cheguei a ter 6 clientes simultâneos com campanhas em diferentes fases — o que salva é documentação e alinhamento proativo.\n\nQuando a capacidade está no limite, comunico antes do prazo, não depois.</div>` },

  // ── COMPORTAMENTAL ──
  { tag:'comportamental', q:'Por que você quer trabalhar nessa posição?',
    body:`<div class="ans">O que me atrai nesse papel é a ponte entre o ecossistema Google e as agências — exige tanto domínio técnico quanto visão estratégica para recomendar a solução certa para cada cliente.\n\nNas agências sempre fui o ponto de referência técnica para decisões de stack. Só que esse papel era exercido dentro de um único cliente. Num papel consultivo isso se torna a função principal, com múltiplos clientes e com o respaldo de parceria certificada Google.\n\nAlém disso, o modelo remoto e o formato consultivo — mais próximo de recomendação e estratégia do que de execução operacional pura — é exatamente o que estou buscando.</div><div class="tip"><strong>💡</strong> Conecte sua experiência passada ao papel específico: ponte Google ↔ agência.</div>` },
  { tag:'comportamental', q:'Por que você está saindo do cargo atual?',
    body:`<div class="ans">Estou em um momento de busca por um novo desafio. Na posição atual tive a oportunidade de trabalhar diretamente em projetos de ad ops e automação em conta multinacional, o que foi muito rico. Mas quero dar um passo em direção a um papel com mais profundidade no ecossistema GMP e com exposição a projetos mais consultivos.</div><div class="tip"><strong>💡</strong> Foque no positivo da mudança, não no negativo do atual.</div>` },
  { tag:'comportamental', q:'Fale de um erro que você cometeu em uma campanha e como resolveu.',
    body:`<div class="ans">Em um projeto em agência, fiz upload de um criativo com a URL de clique apontando para o ambiente de homologação em vez de produção. A campanha ficou ao vivo por algumas horas antes de alguém notar pela performance abaixo do esperado.\n\nAo identificar, pausei imediatamente os ads afetados, fiz a correção e reativei. Comuniquei ao cliente proativamente com o diagnóstico completo — duração do problema, estimativa de cliques afetados e ação tomada.\n\nA partir disso, adicionei ao meu checklist de QA uma etapa específica de validação de URL em ambiente de produção antes de qualquer go-live.</div><div class="tip"><strong>💡</strong> Toda resposta sobre erro precisa ter: o que aconteceu, o que você fez, e o que mudou depois. Nunca termine no problema.</div>` },
  { tag:'comportamental', q:'Você se considera mais operacional ou mais estratégico?',
    body:`<div class="ans">Os dois — e essa combinação é o que torna um especialista GMP realmente útil.\n\nTenho base operacional forte: sei executar trafficking complexo, configurar Floodlights, fazer QA e resolver discrepâncias. Mas o que mais me interessa é usar esses dados para chegar a recomendações que impactam o negócio — otimização de lances, revisão de janela de atribuição, identificação de segmentos que performam acima da média.\n\nPara um papel consultivo, mostrar que você consegue fazer os dois é a resposta certa.</div><div class="tip"><strong>💡</strong> Para um papel consultivo — mostrar que você consegue fazer os dois é a resposta certa.</div>` },

  // ── SALÁRIO ──
  { tag:'salario', q:'Qual é a sua pretensão salarial?',
    body:`<div class="ans">Estou buscando uma faixa próxima de R$ 10.000. Considerando o pacote de benefícios — VA+VR, auxílio home office, saúde e PLR — acredito que o total faz sentido para um papel consultivo com essa profundidade técnica em GMP.\n\nEstou aberto a conversar sobre o pacote completo e o plano de crescimento, e encontrar um ponto que faça sentido para os dois lados.</div><div class="tip"><strong>💡</strong> Com VA 1050 + auxílio home 300 + saúde + PLR, o teto de R$10k na base já é competitivo. Não abra mão fácil — mas se precisar ceder, foque em garantir revisão em 6 meses.</div>` },
  { tag:'salario', q:'Esse valor está acima do nosso range. O que te faria aceitar menos?',
    body:`<div class="ans">Entendo. Considerando o pacote completo — VA+VR, auxílio home office, saúde e PLR — consigo avaliar o total. O que precisaria é de clareza sobre o plano de carreira e uma revisão programada em 6 meses com base em resultado.\n\nSe o range de vocês é X, seria possível compartilhá-lo? Prefiro tomar uma decisão com informação real do que negociar às cegas.</div><div class="tip"><strong>💡</strong> Você já sabe o pacote de benefícios deles — use isso. Avaliar o total demonstra maturidade.</div>` },

  // ── CM360 ──
  { tag:'cm360', q:'Qual a estrutura hierárquica do CM360 e como você a organiza para um cliente enterprise?',
    body:`<p>CM360 segue a hierarquia: <strong>Network → Advertiser → Campaign → Placement → Ad</strong>.</p><ul><li><strong>Network:</strong> nível da agência/revendedora/consultora. Um advertiser por marca-cliente.</li><li><strong>Campaign:</strong> espelha objetivo de negócio (Awareness, Consideration, Conversion). Nunca misturar objetivos numa mesma campanha.</li><li><strong>Placement:</strong> unidade de compra de inventário — um por veículo/formato/segmentação. Nomenclatura rigorosa aqui é essencial para os relatórios.</li><li><strong>Ad:</strong> combinação de criativo + Floodlight. Múltiplos ads por placement para A/B.</li></ul><div class="box info"><div class="box-lbl">ℹ️ Boas práticas</div>Naming convention obrigatório desde o Advertiser — qualquer desvio compromete automação de relatórios. Defino e documento antes de criar o primeiro elemento.</div>` },

  { tag:'cm360', q:'Como você configura o Report Builder do CM360 para relatórios de atribuição?',
    body:`<p>Report Builder permite criar relatórios customizados com dimensões e métricas que a UI padrão não expõe.</p><p><strong>Para atribuição:</strong></p><ul><li>Tipo: <strong>Path to Conversion</strong> — mostra cada touchpoint antes da conversão com seu modelo (last-click, first-click, linear, data-driven)</li><li>Dimensões chave: Channel, Placement, Creative, Floodlight Activity</li><li>Métricas: Impressions, Clicks, Conversions, Revenue, Attribution Credit</li><li>Janela de lookback: alinhada com o ciclo de venda do cliente (7d, 30d, 90d)</li></ul><p><strong>Deduplicação:</strong> configurar o Cross-Channel Deduplication para que uma conversão não seja contada duas vezes quando CM360 e GA4 estão linkados.</p><div class="tip"><strong>💡</strong> Mencione que Path to Conversion revela canais de apoio subfinanciados — argumento forte para migrar de last-click para DDA.</div>` },

  { tag:'cm360', q:'Como funciona o trafficking de criativos no CM360 — quais são os passos críticos?',
    body:`<div class="steps"><div class="step"><div class="sn">1</div><div class="sb"><strong>Upload de criativos</strong> Verificar specs técnicas (tamanho, duração, extensão). Para HTML5, usar Verificador de Anúncio do CM360 antes do upload.</div></div><div class="step"><div class="sn">2</div><div class="sb"><strong>Associar Floodlights</strong> Vincular o Floodlight Activity correto ao Ad — não ao Placement. Confirmar que é o tipo certo (Counter vs. Sales).</div></div><div class="step"><div class="sn">3</div><div class="sb"><strong>Configurar Click Tracker / Landing Page</strong> URL de destino de produção (não homologação). Parâmetros UTM alinhados com GA4.</div></div><div class="step"><div class="sn">4</div><div class="sb"><strong>Gerar Tags</strong> Exportar tags de veiculação (iframe/JavaScript) para cada Placement. Enviar ao publisher com prazo mínimo de 48h.</div></div><div class="step"><div class="sn">5</div><div class="sb"><strong>QA pré-go-live</strong> Verificar preview do criativo, confirmar Floodlight disparando no Tag Assistant, checar URL de clique, datas de voo.</div></div></div><div class="box warn"><div class="box-lbl">⚠️ Erro mais comum</div>URL de landing page apontando para homologação — adiciono verificação explícita ao checklist depois de vivenciar isso.</div>` },

  { tag:'cm360', q:'O que são Custom Variables (u-variables) no Floodlight e quando usar?',
    body:`<p>Custom Variables (u1, u2, ... u100) permitem capturar dados adicionais junto com a conversão — dados do CRM, valor de pedido, ID de produto, segmento do usuário.</p><p><strong>Casos de uso:</strong></p><ul><li><code>u1=order_id</code> — para deduplicação de conversões</li><li><code>u2=product_category</code> — segmentar relatórios de conversão por categoria</li><li><code>u3=customer_segment</code> — audiências de remarketing mais precisas</li><li><code>u4=revenue</code> — para Floodlight de venda com valor dinâmico</li></ul><p><strong>Implementação:</strong> via GTM como variável de Data Layer ou via tag direta na página de confirmação. Sempre documentar no Floodlight Map qual u-variable captura o quê.</p><div class="tip"><strong>💡</strong> Mostre que você não só configura — documenta. O Floodlight Map é o artefato que permite auditoria futura.</div>` },

  { tag:'cm360', q:'Como funciona o Google Campaign Manager Studio (Studio) para criativos dinâmicos?',
    body:`<p>Studio é a plataforma de criação de Dynamic Creative Optimization (DCO) integrada ao CM360.</p><p><strong>Como funciona:</strong></p><ul><li>Designer cria um template HTML5 com variáveis dinâmicas (headline, imagem, CTA, preço)</li><li>Planilha de feed conecta valores a segmentos de audiência ou regras de negócio</li><li>CM360 serve a versão do criativo em tempo real com base no perfil do usuário</li></ul><p><strong>Quando recomendar:</strong></p><ul><li>E-commerce com catálogo grande — criativo dinâmico por produto visto</li><li>Retargeting baseado em comportamento — mensagem diferente por estágio do funil</li><li>Personalização geográfica — cidade ou região no criativo</li></ul><div class="box info"><div class="box-lbl">ℹ️ Pré-requisito</div>Floodlights bem configurados com u-variables capturando o comportamento — é a base do feed de personalização.</div>` },

  // ── DV360 ──
  { tag:'dv360', q:'Quais tipos de inventário o DV360 acessa e como escolher entre eles?',
    body:`<p>DV360 acessa quatro tipos de inventário programático:</p><div class="tbl-w"><table><thead><tr><th>Tipo</th><th>Como funciona</th><th>Quando usar</th></tr></thead><tbody>
      <tr><td><strong>Open Auction</strong></td><td>RTB aberto — todos os DSPs competem</td><td>Escala e volume, menor custo</td></tr>
      <tr><td><strong>Private Marketplace (PMP)</strong></td><td>Deal negociado com publisher, prioridade sobre open</td><td>Inventário premium com controle de contexto</td></tr>
      <tr><td><strong>Preferred Deal</strong></td><td>Preço fixo negociado, sem garantia de volume</td><td>Publisher específico, preço controlado</td></tr>
      <tr><td><strong>Programmatic Guaranteed (PG)</strong></td><td>Volume e preço garantidos — direto digitalizado</td><td>Substituir compra direta com automação de audience</td></tr>
    </tbody></table></div><div class="tip"><strong>💡</strong> Para consultoria GMP: PMP e PG são os deals que clientes enterprise mais usam. Mostrar que você sabe negociar deals com publishers e configurá-los no DV360 é diferencial.</div>` },

  { tag:'dv360', q:'Como configurar audiências no DV360 — quais as principais fontes?',
    body:`<p>DV360 combina múltiplas fontes de audiência:</p><ul><li><strong>Google Audiences:</strong> In-market, Affinity, Demographics — prontas para uso</li><li><strong>Custom Intent:</strong> usuários que pesquisaram termos específicos no Google — ótimo para captura de demanda ativa</li><li><strong>Remarketing via Floodlight:</strong> lista gerada por ação no site (visitou página X, converteu Y) — requer Floodlight configurado no CM360</li><li><strong>Customer Match:</strong> upload de lista de CRM (email hash) — para reativar base ou excluir clientes atuais</li><li><strong>Lookalike:</strong> expansão de audiência similar à lista seed — ampliar alcance com qualidade</li></ul><div class="box warn"><div class="box-lbl">⚠️ Dependência crítica</div>Remarketing via Floodlight só funciona se as tags estiverem disparando corretamente no CM360. Um Floodlight com erro = lista vazia = remarketing sem escala.</div>` },

  { tag:'dv360', q:'O que é Brand Safety no DV360 e como configurar?',
    body:`<p>Brand Safety é o conjunto de controles que evita que o anúncio apareça em contexto inadequado para a marca.</p><p><strong>Camadas de proteção no DV360:</strong></p><ul><li><strong>Digital Content Labels:</strong> excluir categorias de conteúdo (DL-G a DL-MA) — recomendo sempre excluir DL-MA</li><li><strong>Sensitive Categories:</strong> checklist de temas (violência, conteúdo adulto, desastres) — marcar conforme sensibilidade da marca</li><li><strong>Verification (IAS/DoubleVerify):</strong> integração nativa para viewability, brand safety e fraud prevention em tempo real</li><li><strong>Placement Blocklist:</strong> lista de URLs/apps a excluir — manter atualizada com base em relatórios de placement</li></ul><div class="tip"><strong>💡</strong> Para clientes enterprise: Brand Safety é tema de C-level. Configurar e reportar regularmente é parte do serviço consultivo.</div>` },

  { tag:'dv360', q:'Como DV360 e CM360 se integram — qual a diferença de papéis?',
    body:`<p><strong>CM360 é o hub de mensuração</strong> — ad server central que rastreia todos os canais (display, video, search, social).</p><p><strong>DV360 é o DSP</strong> — executa a compra programática de mídia.</p><p><strong>Integração:</strong></p><ul><li>DV360 usa Floodlights do CM360 como sinal de conversão — não configura tags próprias</li><li>CM360 recebe impressões e cliques do DV360 via pixel de veiculação</li><li>Relatórios de atribuição cruzada ficam no CM360 — visão unificada de todos os canais</li></ul><div class="box info"><div class="box-lbl">ℹ️ Por que isso importa</div>O cliente que usa DV360 sem CM360 perde a visão cross-channel. Vender a integração CM360+DV360 é argumento de valor claro para uma consultoria GMP.</div>` },

  { tag:'dv360', q:'Como funciona o modelo de lances no DV360 — Smart Bidding vs. manual?',
    body:`<p><strong>Lances manuais (Fixed CPM):</strong> você define o CPM máximo. Controle total, mas sem otimização automática.</p><p><strong>Smart Bidding no DV360:</strong></p><ul><li><strong>Maximize Conversions:</strong> maximiza conversões dentro do orçamento</li><li><strong>Target CPA:</strong> mantém custo por aquisição próximo do alvo — requer volume mínimo de dados (50+ conv/semana)</li><li><strong>Target ROAS:</strong> maximiza receita pelo alvo de retorno — requer Floodlight de Sales com valor configurado</li><li><strong>Viewability-Based:</strong> otimiza para impressões visíveis — útil para awareness</li></ul><div class="tip"><strong>💡</strong> Smart Bidding no DV360 se alimenta dos Floodlights do CM360. Quanto mais sólida a configuração de tags, melhor o sinal para o algoritmo.</div>` },

  // ── SA360 ──
  { tag:'sa360', q:'O que são Portfolio Bid Strategies no SA360 e quando recomendar?',
    body:`<p>Portfolio Bid Strategies permitem otimizar lances de <strong>múltiplas campanhas como um portfólio único</strong>, em vez de otimizar cada campanha isoladamente.</p><p><strong>Por que usar:</strong></p><ul><li>O algoritmo distribui budget onde a margem de conversão é maior — em vez de cada campanha competir internamente</li><li>Sinal de conversão mais robusto: agrega dados de todas as campanhas no portfólio</li><li>Funciona com Floodlight do CM360 como sinal principal — não depende só do Google Ads</li></ul><p><strong>Quando NÃO usar:</strong> campanhas com objetivos muito diferentes (Awareness vs. Conversão) no mesmo portfólio — a otimização conflita.</p><div class="tip"><strong>💡</strong> Recomendar Portfolio Bid Strategy é argumento para SA360: não existe essa funcionalidade no Google Ads nativo com cross-engine.</div>` },

  { tag:'sa360', q:'Como funciona o Inventory Management do SA360?',
    body:`<p>Inventory Management cria, pausa e ativa anúncios automaticamente com base em um <strong>feed de dados externo</strong> (produto, estoque, preço).</p><p><strong>Fluxo:</strong></p><ul><li>Feed (planilha ou URL) com produtos, preços e disponibilidade</li><li>SA360 lê o feed periodicamente (frequência configurável)</li><li>Quando produto fica indisponível → pausa automaticamente os anúncios daquele produto</li><li>Quando volta ao estoque → reativa</li></ul><p><strong>Caso de uso típico:</strong> varejista com milhares de SKUs — manter 10.000 anúncios de produto ativos/pausos manualmente é inviável.</p><div class="box warn"><div class="box-lbl">⚠️ Requer setup inicial</div>Feed precisa de estrutura definida e o mapeamento de campos levam um tempo de configuração. Não é "ligar e esquecer".</div>` },

  { tag:'sa360', q:'O SA360 suporta múltiplas engines de busca — como isso funciona?',
    body:`<p>SA360 gerencia campanhas de busca em múltiplos engines numa interface única:</p><ul><li><strong>Google Ads</strong> — integração nativa</li><li><strong>Microsoft Advertising (Bing)</strong> — importação e sincronização de campanhas</li><li><strong>Yahoo Japan</strong> — para mercado japonês</li></ul><p><strong>Funcionalidades cross-engine:</strong></p><ul><li><strong>Reporting unificado:</strong> métricas de todos os engines numa view só</li><li><strong>Portfolio Bid Strategy cross-engine:</strong> otimizar lances considerando Google e Bing juntos</li><li><strong>Floodlight como conversão comum:</strong> mesma tag mede conversões de todos os engines</li></ul><div class="tip"><strong>💡</strong> Para clientes com operação global ou Bing relevante: SA360 é o único jeito de ter bid strategy cross-engine com Floodlight como sinal unificado.</div>` },

  { tag:'sa360', q:'Como o SA360 se integra ao CM360 para mensuração unificada?',
    body:`<p>A integração SA360 ↔ CM360 é via <strong>Floodlight compartilhado</strong>:</p><ul><li>SA360 usa as Floodlight Activities do CM360 como sinal de conversão — não configura tags de conversão separadas no Google Ads</li><li>CM360 recebe os cliques de search do SA360 e os atribui no Path to Conversion</li><li>Resultado: visão completa do funil — search aparece como canal no relatório de atribuição multicanal do CM360</li></ul><p><strong>Por que isso importa:</strong> sem a integração, search fica em silos — Google Ads mede com last-click, CM360 não vê o search. Com a integração, DDA no CM360 distribui crédito entre display (via DV360) e search (via SA360).</p><div class="box ok"><div class="box-lbl">✓ Argumento de venda</div>Vender a integração CM360 + SA360 + DV360 como stack unificado é o core de um papel consultivo GMP.</div>` },

  { tag:'sa360', q:'Como funciona o Smart Bidding no SA360 versus Google Ads nativo?',
    body:`<div class="tbl-w"><table><thead><tr><th>Feature</th><th>Google Ads Nativo</th><th>SA360</th></tr></thead><tbody>
      <tr><td>Sinal de conversão</td><td>Google Ads Conversion</td><td><strong>Floodlight (CM360)</strong> — mais confiável</td></tr>

    </tbody></table></div><div class="tip"><strong>💡</strong> O argumento central: o sinal de conversão do SA360 é o Floodlight, que é cross-channel. O Google Ads nativo só "vê" o próprio canal.</div>` },

/* ── state ── */
let filt = 'all';
let srch = '';

function hl(text, q) {
  if (!q) return text;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function tagLabel(t) {
  return {gmp:'GMP',analytics:'Analytics',comportamental:'Comportamental',situacional:'Situacional',salario:'Salário',doc:'Contexto',cm360:'CM360',dv360:'DV360',sa360:'SA360'}[t]||t;
}

function render() {
  const q = srch.toLowerCase().trim();
  const show = ITEMS.filter(it => {
    const mf = filt === 'all' || it.tag === filt;
    const mq = !q || it.q.toLowerCase().includes(q) || it.body.toLowerCase().includes(q);
    return mf && mq;
  });

  document.getElementById('count').textContent = show.length + ' item' + (show.length !== 1 ? 's' : '');

  const feed = document.getElementById('feed');
  if (!show.length) { feed.innerHTML = '<div class="empty">Nenhum resultado encontrado.</div>'; return; }

  feed.innerHTML = show.map((it, i) => {
    const qhl = hl(it.q, q);
    return `<div class="card" data-i="${i}">
      <div class="ch">
        <span class="ctag t-${it.tag}">${tagLabel(it.tag)}</span>
        <span class="cq">${qhl}</span>
        <svg class="chev" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
      </div>
      <div class="cb">${it.body}</div>
    </div>`;
  }).join('');

  feed.querySelectorAll('.ch').forEach(h => h.addEventListener('click', () => h.closest('.card').classList.toggle('open')));
}

/* ── search ── */
const inp = document.getElementById('q');
const clrBtn = document.getElementById('clr');
inp.addEventListener('input', e => {
  srch = e.target.value;
  clrBtn.style.display = srch ? '' : 'none';
  render();
});
function clearQ() { inp.value = ''; srch = ''; clrBtn.style.display = 'none'; inp.focus(); render(); }

/* ── filters ── */
document.querySelectorAll('.fb').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fb').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  filt = b.dataset.f;
  render();
}));

render();
</script>
